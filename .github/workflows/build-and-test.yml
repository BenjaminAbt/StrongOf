name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'
      upload-test-results:
        description: 'Whether to upload test results as artifacts'
        required: true
        type: boolean
      upload-packages:
        description: 'Whether to upload NuGet packages'
        required: true
        type: boolean
    outputs:
      version:
        description: 'The calculated version from NBGV'
        value: ${{ jobs.build.outputs.version }}

jobs:
  native-aot:
    name: NativeAOT (${{ matrix.rid }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0, net11.0]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
          global-json-file: global.json
      - name: Install native toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish native sample (warnings are errors)
        run: dotnet publish samples/StrongOf.NativeAot/StrongOf.NativeAot.csproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} -o artifacts/native-aot
      - name: Run native sample (Linux)
        if: runner.os == 'Linux'
        run: ./artifacts/native-aot/StrongOf.NativeAot --require-native
      - name: Run native sample (Windows)
        if: runner.os == 'Windows'
        run: ./artifacts/native-aot/StrongOf.NativeAot.exe --require-native

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.SemVer2 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
          global-json-file: global.json

      - name: Calculate Version with NBGV
        uses: dotnet/nbgv@v0.5.2
        id: nbgv
        with:
          setAllVars: true

      - name: Version Info
        run: |
          echo "Calculated version: ${{ steps.nbgv.outputs.SemVer2 }}"

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build --configuration ${{ inputs.configuration }} --verbosity minimal /p:Version=${{ steps.nbgv.outputs.SemVer2 }}

      - name: Test and verify 100% line and branch coverage
        shell: pwsh
        run: ./tools/Test-Coverage.ps1 -Configuration '${{ inputs.configuration }}' -NoBuild

      - name: Upload test results
        if: always() && inputs.upload-test-results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: |
            TestResults/coverage-*/*.trx
            TestResults/coverage-*/coverage.cobertura.*.xml

      - name: Pack NuGet packages
        run: dotnet pack --configuration ${{ inputs.configuration }} --no-build --include-symbols -p:SymbolPackageFormat=snupkg --output ./artifacts /p:PackageVersion=${{ steps.nbgv.outputs.SemVer2 }}

      - name: Upload NuGet packages
        if: inputs.upload-packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 30
